name: Automated Code Quality Fixer

on:
  schedule:
    # Run every midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  autofix:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python Environment
        run: |
          python --version
          pip --version

      - name: Verify agy-autofix CLI Environment
        run: |
          agy-autofix --help

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run agy-autofix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agy-autofix run --auto-approve
